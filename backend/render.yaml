# ─────────────────────────────────────────────────────────────────────
# RENDER.YAML - Event Intelligence Agent (slim)
#
# No database, no scrapers, no queue. The backend is two endpoints:
#   POST /api/search        → ChatGPT real web search (needs OPENAI_API_KEY)
#   POST /api/email-report  → PDF via Resend (needs RESEND_API_KEY)
# ─────────────────────────────────────────────────────────────────────

services:
  - type: web
    name: event-agent-backend
    runtime: python
    rootDir: backend
    buildCommand: |
      apt-get install -y \
        libpango-1.0-0 \
        libpangoft2-1.0-0 \
        libcairo2 \
        libgdk-pixbuf2.0-0 \
        libharfbuzz0b \
        libffi-dev \
        shared-mime-info \
        2>/dev/null || true
      pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      # ── ChatGPT real web search ───────────────────────────────────
      - key: OPENAI_API_KEY
        sync: false   # ← set in Render dashboard, not here (keep secret)
      - key: OPENAI_SEARCH_MODEL
        value: gpt-5

      # ── Lead capture (optional - Neon Postgres connection string) ──
      - key: DATABASE_URL
        sync: false   # ← set in Render dashboard (keep secret); unset = nothing stored

      # ── Upstash Redis (optional - cache + daily rate limit) ───────
      - key: REDIS_URL
        sync: false   # ← rediss://default:<pass>@<host>.upstash.io:6379
      - key: SEARCH_DAILY_LIMIT
        value: "3"
      - key: SEARCH_CACHE_TTL_SECONDS
        value: "86400"

      # ── OTP emails via Brevo HTTP API (Render free blocks SMTP!) ──
      - key: BREVO_API_KEY
        sync: false   # brevo.com → SMTP & API → API keys (v3)
      - key: BREVO_FROM_EMAIL
        sync: false   # a sender verified in Brevo, e.g. verify@expotofunnel.com

      # ── OTP via SMTP (paid hosts only - Render free blocks the ports)
      - key: SMTP_HOST
        sync: false   # e.g. smtp.gmail.com or smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false   # Google App Password / Brevo SMTP key
      - key: SMTP_FROM
        sync: false   # optional; defaults to SMTP_USER

      # ── Email (Resend - PDF report only once SMTP is set) ─────────
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: reports@leadstrategus.com

      # ── Frontend / CORS ───────────────────────────────────────────
      - key: FRONTEND_ORIGIN
        sync: false

  - type: web
    name: event-agent-frontend
    runtime: static
    rootDir: frontend
    # `npm run build` runs `vite build` then scripts/prerender.mjs, which
    # launches a Chromium install (frontend/package.json's postinstall
    # script runs `playwright install chromium` - no --with-deps, since
    # Render's static-site build has no root/sudo to apt-get system libs)
    # to render "/", "/privacy", "/terms", "/pricing" and "/faq" into real
    # static HTML under dist/. Without this, the app is a client-only SPA
    # (dist/index.html ships as an empty <div id="root">) - a fetch that
    # doesn't run JS, which is how most LLM crawlers (GPTBot, ClaudeBot,
    # PerplexityBot, ...) read pages, only ever sees that empty shell.
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    # Render's rewrite rules apply unconditionally - a catch-all "/*" rule
    # serves /index.html for every request, even ones with a matching
    # static file already on disk (confirmed: /faq was returning the
    # homepage, not dist/faq/index.html, until these explicit rules were
    # added). So each prerendered route needs its own rewrite to its own
    # file, listed before the SPA catch-all.
    #
    # SPA fallback (the final "/*" rule below): this is a single-page app,
    # only index.html is a real file for every route not listed above it.
    # Without it, a direct request for a route with no prerendered file -
    # a pasted link, a refresh, a search hit - 404s at Render's static file
    # server before React ever loads. This is Render's equivalent of the
    # Apache SPA fallback in public/.htaccess: route the path back to
    # index.html and let the app's client-side router (App.jsx) take over.
    routes:
      - type: rewrite
        source: /privacy
        destination: /privacy/index.html
      - type: rewrite
        source: /terms
        destination: /terms/index.html
      - type: rewrite
        source: /pricing
        destination: /pricing/index.html
      - type: rewrite
        source: /faq
        destination: /faq/index.html
      - type: rewrite
        source: /*
        destination: /index.html
